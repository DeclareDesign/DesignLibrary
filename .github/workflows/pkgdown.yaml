# Builds the pkgdown site without deploying it.
#
# declaredesign.org owns publishing: its "Build Pkgdown" workflow clones this
# repository nightly and pushes the result to that site's gh-pages. This job
# exists to catch, on the commit that causes it, the two failures that only
# ever surfaced there.
#
# It is the only thing in this repository that runs the vignettes at all.
# .Rbuildignore excludes `vignettes`, so they are not in the tarball and
# R-CMD-check never touches them. A vignette that stops working is invisible
# to every other check here.
#
# It also runs pkgdown's reference-index check, so an exported function that
# nobody added to _pkgdown.yml fails here rather than in the other repository.
on:
  push:
    branches: [main, master, rewrite]
  pull_request:
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # "always" sends macOS to Posit Package Manager as well as Linux.
          # CRAN served part of its macOS arm64 R 4.6 binaries as zstd archives
          # under the .tgz name from 2026-09-17, estimatr 2.0.0 among them, and
          # the pak that setup-r-dependencies installs cannot extract zstd
          # (r-lib/pkgdepends#485). Posit Package Manager still serves gzip
          # builds of the same versions.
          # Back to "true" once a released pak reads zstd.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
