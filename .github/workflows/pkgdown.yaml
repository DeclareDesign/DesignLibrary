# Builds the pkgdown site without deploying it.
#
# declaredesign.org owns publishing: its "Build Pkgdown" workflow clones this
# repository nightly and pushes the result to that site's gh-pages. This job
# exists to catch a site that will not build on the commit that breaks it,
# rather than in the other repository. Its reference-index check fails when an
# exported function was never added to _pkgdown.yml.
on:
  schedule:
    - cron: "23 14 * * 0"
  push:
    branches: [main, master, RDrewrite]
  pull_request:
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # "always", as in R-CMD-check.yaml: the pak that
          # setup-r-dependencies installs cannot extract zstd
          # (r-lib/pkgdepends#485), and Posit Package Manager still serves
          # gzip builds.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
