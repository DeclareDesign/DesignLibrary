url: https://declaredesign.org/r/designlibrary/
template:
  bootstrap: 5
home:
  title: DesignLibrary
  description: A library of declared designs (DeclareDesign), with a small API and bundled Shiny browser.
navbar:
  structure:
    left: [intro, reference, articles]
    right: [github]
  components:
    articles:
      text: Articles
      menu:
      - text: DesignLibrary overview
        href: articles/DesignLibrary.html
      - text: Contributing a design
        href: articles/contributing.html
articles:
- title: Getting started
  contents:
  - DesignLibrary
  - contributing
reference:
- title: Discover
  desc: Browse the design library.
  contents:
  - list_designs
  - design_info
  - preferred_diagnosands
  - excluded_diagnosands
- title: Build & inspect
  desc: Load designs, change parameters, and read code.
  contents:
  - make_design
  - get_args
  - print.design_library_args
  - get_code
  - design_profile
- title: Shiny
  desc: Browse designs interactively and deploy a standalone app folder.
  contents:
  - run_shiny
  - copy_library_shiny
  - install_library_dependencies
  - get_preview
  - has_preview
- title: Maintain
  desc: Index, audit, bake previews, refresh the library, and build the site.
  contents:
  - refresh_library
  - make_index
  - audit_designs
  - write_audit_report
  - bake_previews
  - build_docs
  - contributor_checklist
  - param_coverage_report
  - param_coverage_gaps
- title: DesignLibrary 0.1 designers
  desc: Designer functions with their DesignLibrary 0.1 names and arguments. Working ports call `make_design()`; unported names are stubs that point to related library designs.
- subtitle: Working designers
  contents:
  - two_arm_designer
  - two_arm_attrition_designer
  - pretest_posttest_designer
  - randomized_response_designer
  - mediation_analysis_designer
  - multi_arm_designer
  - two_by_two_designer
  - block_cluster_two_arm_designer
- subtitle: Unported stubs
  contents:
  - designers-not-ported
